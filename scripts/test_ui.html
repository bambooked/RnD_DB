<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">UI テスト</h1>

    <button onclick="testUpdateRelatedItems()" class="bg-blue-600 text-white px-4 py-2 rounded mb-4">
        テストデータで表示
    </button>

    <button onclick="clearSection()" class="bg-red-600 text-white px-4 py-2 rounded mb-4 ml-2">
        クリア
    </button>

    <!-- 関連ファイル・フォルダ表示エリア -->
    <div id="related-items-section" class="hidden mt-4 p-4 bg-gradient-to-r from-blue-50 to-purple-50 border border-blue-200 rounded-lg">
        <h3 class="text-sm font-bold text-gray-800 mb-3 flex items-center">
            <i class="fas fa-link text-blue-600 mr-2"></i>
            提案されたファイル・フォルダ
        </h3>
        <div id="related-items-content" class="space-y-2">
            <!-- 動的に生成されます -->
        </div>
    </div>

    <div id="debug-info" class="mt-4 p-4 bg-gray-100 rounded">
        <h2 class="font-bold mb-2">デバッグ情報</h2>
        <div id="debug-content"></div>
    </div>

    <script>
        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function updateRelatedItems(data) {
            console.log('updateRelatedItems called', data);
            const section = document.getElementById('related-items-section');
            const content = document.getElementById('related-items-content');

            // 関連文書と関連データセットをチェック
            const hasRelatedDocs = data.related_documents && data.related_documents.length > 0;
            const hasRelevantDatasets = data.relevant_datasets && data.relevant_datasets.length > 0;

            console.log('hasRelatedDocs:', hasRelatedDocs);
            console.log('hasRelevantDatasets:', hasRelevantDatasets);

            if (!hasRelatedDocs && !hasRelevantDatasets) {
                section.classList.add('hidden');
                return;
            }

            let html = '';

            // 関連文書（論文・ポスター）を表示
            if (hasRelatedDocs) {
                html += '<div class="mb-3">';
                html += '<h4 class="text-xs font-semibold text-gray-700 mb-2"><i class="fas fa-file-alt text-blue-500 mr-1"></i>関連文書</h4>';
                html += '<div class="grid grid-cols-1 gap-2">';

                data.related_documents.forEach(doc => {
                    const icon = doc.type === 'paper' ? 'fa-file-alt' : 'fa-image';
                    const iconColor = doc.type === 'paper' ? 'text-blue-600' : 'text-green-600';
                    const title = doc.title || doc.file_name || '無題';

                    html += `
                        <div class="bg-white border border-gray-300 rounded-md p-3 hover:shadow-md transition-shadow">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <div class="flex items-center mb-1">
                                        <i class="fas ${icon} ${iconColor} text-sm mr-2"></i>
                                        <span class="font-medium text-gray-800 text-sm">${escapeHtml(title)}</span>
                                    </div>
                                    ${doc.authors ? `<p class="text-xs text-gray-600 ml-6 mb-1">著者: ${escapeHtml(doc.authors)}</p>` : ''}
                                    ${doc.abstract ? `<p class="text-xs text-gray-500 ml-6">${escapeHtml(doc.abstract.substring(0, 100))}...</p>` : ''}
                                </div>
                                ${doc.drive_url ? `
                                    <a href="${doc.drive_url}" target="_blank"
                                       class="ml-2 px-3 py-1 bg-blue-100 text-blue-700 rounded hover:bg-blue-200 transition-colors text-xs font-medium flex items-center">
                                        <i class="fas fa-external-link-alt mr-1"></i>開く
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                html += '</div></div>';
            }

            // 関連データセットを表示
            if (hasRelevantDatasets) {
                html += '<div>';
                html += '<h4 class="text-xs font-semibold text-gray-700 mb-2"><i class="fas fa-database text-purple-500 mr-1"></i>関連データセット</h4>';
                html += '<div class="grid grid-cols-1 gap-2">';

                data.relevant_datasets.forEach(ds => {
                    const name = ds.name || '無題';
                    const fileCountText = ds.file_count ? `${ds.file_count}ファイル` : '';
                    const sizeMB = ds.total_size ? (ds.total_size / (1024 * 1024)).toFixed(1) : '0';

                    html += `
                        <div class="bg-white border border-gray-300 rounded-md p-3 hover:shadow-md transition-shadow">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <div class="flex items-center mb-1">
                                        <i class="fas fa-database text-purple-600 text-sm mr-2"></i>
                                        <span class="font-medium text-gray-800 text-sm">${escapeHtml(name)}</span>
                                    </div>
                                    ${ds.description ? `<p class="text-xs text-gray-600 ml-6 mb-1">${escapeHtml(ds.description)}</p>` : ''}
                                    ${ds.summary ? `<p class="text-xs text-gray-500 ml-6 mb-1">${escapeHtml(ds.summary.substring(0, 100))}...</p>` : ''}
                                    <p class="text-xs text-gray-500 ml-6">
                                        <i class="fas fa-folder text-xs mr-1"></i>${fileCountText}
                                        <i class="fas fa-hdd text-xs ml-2 mr-1"></i>${sizeMB} MB
                                    </p>
                                </div>
                                ${ds.drive_url ? `
                                    <a href="${ds.drive_url}" target="_blank"
                                       class="ml-2 px-3 py-1 bg-purple-100 text-purple-700 rounded hover:bg-purple-200 transition-colors text-xs font-medium flex items-center">
                                        <i class="fas fa-external-link-alt mr-1"></i>開く
                                    </a>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });

                html += '</div></div>';
            }

            content.innerHTML = html;
            section.classList.remove('hidden');

            document.getElementById('debug-content').innerHTML = `
                <p>hasRelatedDocs: ${hasRelatedDocs}</p>
                <p>hasRelevantDatasets: ${hasRelevantDatasets}</p>
                <p>セクション表示: ${!section.classList.contains('hidden')}</p>
            `;
        }

        function testUpdateRelatedItems() {
            const testData = {
                "related_documents": [],
                "relevant_datasets": [
                    {
                        "dataset_id": 4,
                        "name": "jbbq",
                        "description": "Google Driveから同期: 5ファイル",
                        "file_count": 5,
                        "total_size": 46127196,
                        "drive_url": null
                    },
                    {
                        "dataset_id": 3,
                        "name": "tv_efect",
                        "description": "Google Driveから同期: 2ファイル",
                        "file_count": 2,
                        "total_size": 173577,
                        "drive_url": "https://drive.google.com/drive/folders/test123"
                    }
                ]
            };

            updateRelatedItems(testData);
        }

        function clearSection() {
            const section = document.getElementById('related-items-section');
            section.classList.add('hidden');
            document.getElementById('debug-content').innerHTML = '<p>セクションを非表示にしました</p>';
        }
    </script>
</body>
</html>
